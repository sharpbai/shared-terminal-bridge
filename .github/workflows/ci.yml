name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q bridge mcp_server stb_cli
      - name: Run container-safe unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check executable entry points
        run: |
          python bridge/local_bridge.py --help
          python mcp_server/server.py --help
          python bin/stb --help

  host-tmux:
    name: Host tmux integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tmux on the host runner
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Run real tmux integration baselines outside a container
        run: python -m unittest discover -s tests/host_tmux -p 'test_*.py' -v
